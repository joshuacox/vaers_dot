<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chart Gallery</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .gallery img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .gallery figure {
            margin: 0;
            text-align: center;
        }

        .gallery figcaption {
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
        }

        /* Modal styles */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <h1>Chart Gallery</h1>
    I will postulate that the likelihood that a death be attributed to the vaccine as inversely proportional to the
    likelihood that a death be attributed to COVID19 itself. So the data is likely skewed even higher than it appears
    here.
    <div class="gallery">
        <figure>
            <img src="deepseek-v2.5-chart.png" alt="DeepSeek v2.5 Chart">
            <figcaption>DeepSeek v2.5 Chart</figcaption>
        </figure>
        <figure>
            <img src="weeklyDeaths2020-2023.png" alt="Weekly Deaths 2020-2023">
            <figcaption>Weekly Deaths 2020-2023</figcaption>
        </figure>
        <figure>
            <img src="DHL1999-2023.png" alt="DHL1999-2023">
            <figcaption>DHL1999-2023</figcaption>
        </figure>
        <figure>
            <img src="DHEL1999-2023Figure_1.png" alt="DHEL1999-2023 Figure 1">
            <figcaption>DHEL1999-2023 Figure 1</figcaption>
        </figure>
    </div>

    <!-- Modal container -->
    <div class="modal" id="imageModal">
        <img src="" alt="Full size image" id="modalImg">
    </div>

    <script src="index.js"></script>
</body>

</html>
