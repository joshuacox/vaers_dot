<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chart Gallery</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .gallery img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
        }
        .gallery figure {
            margin: 0;
            text-align: center;
        }
        .gallery figcaption {
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Chart Gallery</h1>
    <div class="gallery">
        <figure>
            <img src="DHEL1999-2023Figure_1.png" alt="DHEL1999-2023 Figure 1">
            <figcaption>DHEL1999-2023 Figure 1</figcaption>
        </figure>
        <figure>
            <img src="DHL1999-2023.png" alt="DHL1999-2023">
            <figcaption>DHL1999-2023</figcaption>
        </figure>
        <figure>
            <img src="DLH_1999-2023.png" alt="DLH 1999-2023">
            <figcaption>DLH 1999-2023</figcaption>
        </figure>
        <figure>
            <img src="deepseek-v2.5-chart.png" alt="DeepSeek v2.5 Chart">
            <figcaption>DeepSeek v2.5 Chart</figcaption>
        </figure>
        <figure>
            <img src="weeklyDeaths2020-2023.png" alt="Weekly Deaths 2020-2023">
            <figcaption>Weekly Deaths 2020-2023</figcaption>
        </figure>
    </div>
</body>
</html>
